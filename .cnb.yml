# agent-kb 云原生 CI —— 测试门禁 + NPC 派单通道
#
# 1) push / PR 时跑单测 + 冒烟脚本（纯标准库 Python，零第三方依赖）
# 2) POST api_trigger_npc 事件给 CodeBuddy NPC，让它在 feat 分支上做增量开发
#
# 派单命令：
#   cnb build start-build --repo apigogo/agent-kb --event api_trigger_npc \
#     --branch feat --title "<t>" --npc-name CodeBuddy --npc-workMode \
#     --data "<json body>"
#
# 或用本仓现成脚本：
#   python .analysis/dispatch_npc.py <任务书.md> feat

# ── 测试环境 ──────────────────────────────────────────────
# ⛔ 不得依赖缺省镜像：缺省镜像里没有 python3，
#    脚本会以 `sh: python3: command not found`（127）挂掉。
#    python:3.11-slim 自带 python3，且无需额外装包。
.test-python: &test-python
  docker:
    image: python:3.11-slim

# ── 测试步骤（push / PR 共用） ────────────────────────────
.test-stages: &test-stages
  - name: unit tests
    script: python3 -m unittest discover tests/ -v
    timeout: 10m
  - name: smoke test
    script: python3 scripts/smoke_test.py
    timeout: 10m

# 通用测试流水线：任何分支的 push / PR 都跑
#
# ⛔ docker.image 必须显式指定带 Python 的镜像：
# 缺省镜像 cnbcool/default-build-env 里没有 python3，
# 脚本写 `python3` 会直接 `python3: command not found`（退出码 127）。
"**":
  push:
    - name: unit-and-smoke
      <<: *test-python
      stages: *test-stages
  pull_request:
    - name: unit-and-smoke
      <<: *test-python
      stages: *test-stages

feat:
  api_trigger_npc:
    - docker:
        image: cnbcool/default-npc:latest
      # ⛔ 必须保持 false：sandbox=true 时 CNB_TOKEN 失效，NPC 推不了分支/建不了 PR，
      # 且 npc:go 仍 exit 0 → build 假 success
      sandbox: false
      stages:
        - name: npc go
          type: npc:go
          # timeout 对 npc:go 只作用于「单次工具执行」；会话整体仍受平台
          # maxPipelineRunTime=2h 硬边界（不可配置，别把力气花在改这个上）
          timeout: 4h
          options:
            # role 不设（不传 role，避免触发仓库 settings.yml 解析）
            # 防御性兜底：api_trigger_npc 若退回「非 NPC 事件」路径时，
            # npc:go 强制要求 systemPrompt，否则秒报 build error
            systemPrompt: |
              你是 agent-kb 项目的自动化 NPC「CodeBuddy」。
              严格按 userPrompt 中的任务书执行：先读任务书与验收清单再动手；
              遵守「开工即推、增量推送（≥3 次）」纪律。
              结果通过 PR 回报；遇权限不足（403）立即回贴求授权，不要静默放弃。
              平台 2h 硬边界不可逾越，每完成一个可编译/可验证小步就 commit push。
            # ⛔ userPrompt 必须保持变量引用（$userPrompt），不得写死字面量
            userPrompt: $userPrompt
